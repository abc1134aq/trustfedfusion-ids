<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="860" viewBox="0 0 1440 860" role="img" aria-labelledby="title desc">
  <title id="title">Figure 3 publication draft: TrustFedFusion-IDS evaluation protocol</title>
  <desc id="desc">A protocol map showing datasets, no-leakage evidence variants, corruption stressors, federated aggregators, metrics, and manuscript claim gates used to evaluate TrustFedFusion-IDS.</desc>
  <defs>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <path d="M2,2 L10,6 L2,10 Z" fill="#334155"/>
    </marker>
    <style>
      .title { font: 700 28px Arial, Helvetica, sans-serif; fill: #0f172a; }
      .subtitle { font: 400 15px Arial, Helvetica, sans-serif; fill: #475569; }
      .panel-title { font: 700 17px Arial, Helvetica, sans-serif; fill: #0f172a; }
      .label { font: 700 15px Arial, Helvetica, sans-serif; fill: #0f172a; }
      .small { font: 400 13px Arial, Helvetica, sans-serif; fill: #334155; }
      .tiny { font: 400 12px Arial, Helvetica, sans-serif; fill: #475569; }
      .panel { fill: #f8fafc; stroke: #cbd5e1; stroke-width: 1.2; rx: 14; }
      .data { fill: #e2e8f0; stroke: #64748b; stroke-width: 1.2; rx: 9; }
      .evidence { fill: #ccfbf1; stroke: #0f766e; stroke-width: 1.2; rx: 9; }
      .stress { fill: #fef3c7; stroke: #b45309; stroke-width: 1.2; rx: 9; }
      .attack { fill: #fee2e2; stroke: #b91c1c; stroke-width: 1.2; rx: 9; }
      .fed { fill: #f5f3ff; stroke: #7c3aed; stroke-width: 1.3; rx: 9; }
      .metric { fill: #ecfdf5; stroke: #15803d; stroke-width: 1.3; rx: 9; }
      .gate { fill: #fff7ed; stroke: #c2410c; stroke-width: 1.3; rx: 9; }
      .note { fill: #ffffff; stroke: #94a3b8; stroke-width: 1; rx: 8; }
      .arrow { stroke: #334155; stroke-width: 2; fill: none; marker-end: url(#arrow); }
      .thin { stroke: #64748b; stroke-width: 1.4; fill: none; marker-end: url(#arrow); }
      .dash { stroke: #94a3b8; stroke-width: 1.4; stroke-dasharray: 6 7; fill: none; }
    </style>
  </defs>

  <rect x="0" y="0" width="1440" height="860" fill="#ffffff"/>
  <text x="44" y="48" class="title">Evaluation protocol: positive, neutral, and negative evidence are all registered</text>
  <text x="44" y="76" class="subtitle">TrustFedFusion-IDS is evaluated with no-label-leakage controls, random CTI checks, non-IID and poisoning stressors, cross-domain probes, and calibration audits.</text>

  <rect x="38" y="112" width="315" height="545" class="panel"/>
  <text x="58" y="142" class="panel-title">1. Dataset scope</text>
  <rect x="64" y="166" width="262" height="58" class="data"/>
  <text x="86" y="191" class="label">Edge-IIoT clean full</text>
  <text x="86" y="212" class="small">Main no-leakage FL/CTI dataset</text>
  <rect x="64" y="242" width="262" height="58" class="data"/>
  <text x="86" y="267" class="label">CICIoT2023 sampled</text>
  <text x="86" y="288" class="small">Schema + rare-family bounded runs</text>
  <rect x="64" y="318" width="262" height="58" class="data"/>
  <text x="86" y="343" class="label">UNSW-NB15 official split</text>
  <text x="86" y="364" class="small">Cross-domain tabular IDS probe</text>
  <rect x="64" y="394" width="262" height="58" class="data"/>
  <text x="86" y="419" class="label">NF-ToN / NF-BoT NetFlow</text>
  <text x="86" y="440" class="small">Stress + per-family 100k cap</text>
  <rect x="64" y="480" width="262" height="86" class="gate"/>
  <text x="86" y="505" class="label">Storage boundary</text>
  <text x="86" y="528" class="small">Kaggle-first for large datasets</text>
  <text x="86" y="549" class="small">Local: schema, samples, manifests</text>
  <text x="58" y="608" class="tiny">Boundary: sampled/capped runs are</text>
  <text x="58" y="626" class="tiny">not full raw-dataset final performance.</text>

  <rect x="383" y="112" width="315" height="545" class="panel"/>
  <text x="403" y="142" class="panel-title">2. Paired evidence variants</text>
  <rect x="409" y="166" width="262" height="58" class="evidence"/>
  <text x="431" y="191" class="label">traffic_only</text>
  <text x="431" y="212" class="small">No weak evidence input</text>
  <rect x="409" y="242" width="262" height="58" class="evidence"/>
  <text x="431" y="267" class="label">weak_cti_concat</text>
  <text x="431" y="288" class="small">Protocol/source-derived hints</text>
  <rect x="409" y="318" width="262" height="58" class="evidence"/>
  <text x="431" y="343" class="label">source_gate</text>
  <text x="431" y="364" class="small">Reliability-weighted evidence</text>
  <rect x="409" y="394" width="262" height="58" class="evidence"/>
  <text x="431" y="419" class="label">cal_source_gate</text>
  <text x="431" y="440" class="small">Validation-selected alpha variants</text>
  <rect x="409" y="480" width="262" height="58" class="stress"/>
  <text x="431" y="505" class="label">random CTI controls</text>
  <text x="431" y="526" class="small">Shuffled/noisy negative evidence</text>
  <rect x="409" y="562" width="262" height="58" class="gate"/>
  <text x="431" y="587" class="label">Leakage guard</text>
  <text x="431" y="608" class="small">No true Attack-type to CTI input</text>

  <rect x="728" y="112" width="315" height="545" class="panel"/>
  <text x="748" y="142" class="panel-title">3. Stress and FL protocol</text>
  <rect x="754" y="166" width="262" height="58" class="fed"/>
  <text x="776" y="191" class="label">Clean non-IID clients</text>
  <text x="776" y="212" class="small">Label-skew and multi-seed splits</text>
  <rect x="754" y="242" width="262" height="58" class="stress"/>
  <text x="776" y="267" class="label">Evidence stressors</text>
  <text x="776" y="288" class="small">Source dropout, CTI poisoning</text>
  <rect x="754" y="318" width="262" height="58" class="attack"/>
  <text x="776" y="343" class="label">Client attacks</text>
  <text x="776" y="364" class="small">Label flip, update scaling</text>
  <rect x="754" y="394" width="262" height="58" class="fed"/>
  <text x="776" y="419" class="label">Robust aggregation</text>
  <text x="776" y="440" class="small">FedAvg, FedProx, median, Krum</text>
  <rect x="754" y="480" width="262" height="58" class="attack"/>
  <text x="776" y="505" class="label">Failure probes</text>
  <text x="776" y="526" class="small">Krum collapse, MLP collapse</text>
  <rect x="754" y="562" width="262" height="58" class="note"/>
  <text x="776" y="587" class="label">Repeatability</text>
  <text x="776" y="608" class="small">3 seeds where promoted to evidence</text>

  <rect x="1073" y="112" width="329" height="545" class="panel"/>
  <text x="1093" y="142" class="panel-title">4. Metrics and claim promotion</text>
  <rect x="1099" y="166" width="276" height="58" class="metric"/>
  <text x="1121" y="191" class="label">Detection utility</text>
  <text x="1121" y="212" class="small">Accuracy, Macro-F1, per-family recall</text>
  <rect x="1099" y="242" width="276" height="58" class="metric"/>
  <text x="1121" y="267" class="label">Operational risk</text>
  <text x="1121" y="288" class="small">Normal FPR, latency, communication</text>
  <rect x="1099" y="318" width="276" height="58" class="metric"/>
  <text x="1121" y="343" class="label">Calibration audit</text>
  <text x="1121" y="364" class="small">ECE, Brier, mean confidence</text>
  <rect x="1099" y="394" width="276" height="58" class="gate"/>
  <text x="1121" y="419" class="label">Random-control gate</text>
  <text x="1121" y="440" class="small">Meaningful evidence must beat random</text>
  <rect x="1099" y="480" width="276" height="58" class="gate"/>
  <text x="1121" y="505" class="label">Claim-evidence registry</text>
  <text x="1121" y="526" class="small">READY / PARTIAL / BLOCKED</text>
  <rect x="1099" y="562" width="276" height="58" class="attack"/>
  <text x="1121" y="587" class="label">Blocked claims</text>
  <text x="1121" y="608" class="small">No solved calibration; no P17 overclaim</text>

  <path class="arrow" d="M353 386 L377 386"/>
  <path class="arrow" d="M698 386 L722 386"/>
  <path class="arrow" d="M1043 386 L1067 386"/>

  <rect x="66" y="694" width="1308" height="96" class="note"/>
  <text x="90" y="724" class="panel-title">Promotion rule for manuscript claims</text>
  <text x="90" y="752" class="small">A variant becomes manuscript-eligible only after pulled outputs are summarized under 04_Results, random controls are checked, and caveats are registered.</text>
  <text x="90" y="775" class="small">Positive, neutral, and negative outcomes are all reported: source gate is useful in several settings, not universally best, and calibration remains unresolved through v0.8.</text>

  <path class="dash" d="M195 657 L195 694"/>
  <path class="dash" d="M540 657 L540 694"/>
  <path class="dash" d="M885 657 L885 694"/>
  <path class="dash" d="M1238 657 L1238 694"/>
</svg>
