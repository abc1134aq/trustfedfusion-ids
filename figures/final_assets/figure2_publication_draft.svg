<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="900" viewBox="0 0 1440 900" role="img" aria-labelledby="title desc">
  <title id="title">Figure 2 publication draft: TrustFedFusion-IDS method overview</title>
  <desc id="desc">A layered architecture showing leakage guard, evidence construction, fusion variants, federated evaluation, reliability metrics, and manuscript claim gate.</desc>
  <defs>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <path d="M2,2 L10,6 L2,10 Z" fill="#334155"/>
    </marker>
    <style>
      .title { font: 700 28px Arial, Helvetica, sans-serif; fill: #0f172a; }
      .subtitle { font: 400 15px Arial, Helvetica, sans-serif; fill: #475569; }
      .lane-title { font: 700 17px Arial, Helvetica, sans-serif; fill: #0f172a; }
      .label { font: 700 15px Arial, Helvetica, sans-serif; fill: #0f172a; }
      .small { font: 400 13px Arial, Helvetica, sans-serif; fill: #334155; }
      .tiny { font: 400 12px Arial, Helvetica, sans-serif; fill: #475569; }
      .lane { fill: #f8fafc; stroke: #cbd5e1; stroke-width: 1.2; rx: 14; }
      .guard { fill: #fff7ed; stroke: #c2410c; stroke-width: 1.4; rx: 10; }
      .traffic { fill: #e2e8f0; stroke: #64748b; stroke-width: 1.2; rx: 10; }
      .evidence { fill: #ccfbf1; stroke: #0f766e; stroke-width: 1.2; rx: 10; }
      .control { fill: #fef3c7; stroke: #b45309; stroke-width: 1.2; rx: 10; }
      .fusion { fill: #eff6ff; stroke: #2563eb; stroke-width: 1.4; rx: 10; }
      .fl { fill: #f5f3ff; stroke: #7c3aed; stroke-width: 1.4; rx: 10; }
      .metric { fill: #ecfdf5; stroke: #15803d; stroke-width: 1.4; rx: 10; }
      .blocked { fill: #fee2e2; stroke: #b91c1c; stroke-width: 1.4; rx: 10; }
      .arrow { stroke: #334155; stroke-width: 2; fill: none; marker-end: url(#arrow); }
      .flow { stroke: #334155; stroke-width: 2; fill: none; }
      .dash { stroke: #64748b; stroke-width: 1.4; stroke-dasharray: 7 7; fill: none; }
    </style>
  </defs>

  <rect x="0" y="0" width="1440" height="900" fill="#ffffff"/>
  <text x="44" y="48" class="title">TrustFedFusion-IDS evaluation pipeline</text>
  <text x="44" y="76" class="subtitle">The method is evaluated through paired evidence variants and negative controls, then passed through federated, robustness, calibration, and claim-safety gates.</text>

  <rect x="38" y="116" width="1364" height="112" class="lane"/>
  <text x="58" y="146" class="lane-title">1. Data and leakage guard</text>
  <rect x="260" y="142" width="230" height="58" class="traffic"/>
  <text x="284" y="167" class="label">Local tabular IDS data</text>
  <text x="284" y="188" class="small">Flow, protocol, device fields</text>
  <rect x="564" y="142" width="330" height="58" class="guard"/>
  <text x="588" y="167" class="label">No label-like evidence leakage</text>
  <text x="588" y="188" class="small">No true Attack-type to CTI mapping as input</text>
  <rect x="968" y="142" width="270" height="58" class="guard"/>
  <text x="992" y="167" class="label">Storage boundary</text>
  <text x="992" y="188" class="small">Kaggle-first for large datasets</text>
  <path class="arrow" d="M490 171 L558 171"/>
  <path class="arrow" d="M894 171 L962 171"/>

  <rect x="38" y="256" width="1364" height="142" class="lane"/>
  <text x="58" y="286" class="lane-title">2. Evidence construction</text>
  <rect x="210" y="306" width="205" height="58" class="traffic"/>
  <text x="236" y="331" class="label">Traffic-only</text>
  <text x="236" y="352" class="small">Baseline feature set</text>
  <rect x="455" y="306" width="230" height="58" class="evidence"/>
  <text x="478" y="331" class="label">Weak CTI hints</text>
  <text x="478" y="352" class="small">Protocol/source-derived</text>
  <rect x="725" y="306" width="230" height="58" class="control"/>
  <text x="748" y="331" class="label">Random CTI control</text>
  <text x="748" y="352" class="small">Shuffled/noisy negative check</text>
  <rect x="995" y="306" width="230" height="58" class="control"/>
  <text x="1018" y="331" class="label">Evidence stressors</text>
  <text x="1018" y="352" class="small">Dropout and poisoning</text>

  <rect x="38" y="426" width="1364" height="154" class="lane"/>
  <text x="58" y="456" class="lane-title">3. Fusion variants</text>
  <rect x="155" y="486" width="188" height="62" class="fusion"/>
  <text x="182" y="512" class="label">traffic_only</text>
  <text x="182" y="533" class="small">No evidence input</text>
  <rect x="383" y="486" width="188" height="62" class="fusion"/>
  <text x="410" y="512" class="label">weak_concat</text>
  <text x="410" y="533" class="small">Weak hints appended</text>
  <rect x="611" y="486" width="188" height="62" class="fusion"/>
  <text x="638" y="512" class="label">source_gate</text>
  <text x="638" y="533" class="small">Reliability-weighted</text>
  <rect x="839" y="486" width="188" height="62" class="fusion"/>
  <text x="866" y="512" class="label">cal_source_gate</text>
  <text x="866" y="533" class="small">Validation-selected</text>
  <rect x="1067" y="486" width="188" height="62" class="fusion"/>
  <text x="1094" y="512" class="label">random_gate</text>
  <text x="1094" y="533" class="small">Negative control</text>
  <path class="arrow" d="M312 364 C312 430, 249 430, 249 480"/>
  <path class="arrow" d="M570 364 C570 430, 477 430, 477 480"/>
  <path class="arrow" d="M570 364 C570 430, 705 430, 705 480"/>
  <path class="arrow" d="M840 364 C840 430, 1161 430, 1161 480"/>
  <path class="arrow" d="M799 517 L833 517"/>

  <rect x="38" y="608" width="1364" height="116" class="lane"/>
  <text x="58" y="638" class="lane-title">4. Federated robustness tests</text>
  <rect x="260" y="650" width="230" height="48" class="fl"/>
  <text x="286" y="680" class="label">FedAvg / FedProx</text>
  <rect x="564" y="650" width="260" height="48" class="fl"/>
  <text x="590" y="680" class="label">Median / trimmed mean / Krum</text>
  <rect x="898" y="650" width="270" height="48" class="fl"/>
  <text x="924" y="680" class="label">Label flip / update scale</text>
  <path class="flow" d="M705 548 L705 620 L375 620"/>
  <path class="arrow" d="M375 620 L375 644"/>
  <path class="arrow" d="M705 620 L694 620 L694 644"/>
  <path class="arrow" d="M705 620 L1033 620 L1033 644"/>

  <rect x="38" y="752" width="1364" height="106" class="lane"/>
  <text x="58" y="782" class="lane-title">5. Metrics and claim gate</text>
  <rect x="215" y="798" width="205" height="40" class="metric"/>
  <text x="238" y="824" class="label">Macro-F1 / recall</text>
  <rect x="455" y="798" width="170" height="40" class="metric"/>
  <text x="481" y="824" class="label">Normal FPR</text>
  <rect x="660" y="798" width="220" height="40" class="metric"/>
  <text x="688" y="824" class="label">ECE / Brier / confidence</text>
  <rect x="915" y="798" width="190" height="40" class="metric"/>
  <text x="940" y="824" class="label">Latency / comm.</text>
  <rect x="1140" y="788" width="210" height="60" class="blocked"/>
  <text x="1166" y="813" class="label">Claim safety gate</text>
  <text x="1166" y="834" class="small">READY / PARTIAL / BLOCKED</text>
  <path class="arrow" d="M375 698 L375 744 L318 744 L318 792"/>
  <path class="arrow" d="M694 698 L694 744 L540 744 L540 792"/>
  <path class="arrow" d="M694 698 L694 744 L770 744 L770 792"/>
  <path class="arrow" d="M1033 698 L1033 744 L1010 744 L1010 792"/>
  <path class="arrow" d="M1105 818 L1134 818"/>

  <path class="dash" d="M44 238 L1396 238"/>
  <path class="dash" d="M44 410 L1396 410"/>
  <path class="dash" d="M44 594 L1396 594"/>
  <path class="dash" d="M44 738 L1396 738"/>
</svg>
